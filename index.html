<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>My First Website</title>
<style>
    body {
        background-color: #EAF4FF;
        font-family: Arial, sans-serif;
        text-align: center;
        padding: 40px;
    }

    h1 {
        color: #245A81;
        font-size: 36px;
    }

    p {
        color: #526779;
        font-size: 18px;
    }.card {
    background-color: white;
    border-radius: 40px;
    padding: 30px;
    box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
    max-width: 400px;
    margin: 40px auto;
}
</style>
</head>
<body>
    <div class="card">
        <h1>Hello, I'm Pixel! 🐟</h1>
        <p id="message">Welcome to my little world.</p>
        <p>I'm learning to build websites!</p>
        <button onclick="sayHello()">Explore My World</button>

<p id="fishDisplay">Fish collected: 0</p>
<div id="fishGarden"></div>
<button onclick="addFish()">Collect a Fish 🐟</button>
    </div>
<script>
    function sayHello() {
    let message = document.getElementById("message");

    if (message.innerText === "Welcome to my little world.") {
        message.innerText = "You found a little surprise! 🐟";
    } else {
        message.innerText = "Welcome to my little world.";
    }
}
    let fishCount = 0;

function addFish() {
    let aquaticAnimals = [
    "🐟", "🐠", "🐡",
    "🐬", "🐳", "🦈",
    "🐙", "🦀", "🦐",
    "🪼", "🦑", "🐢",
    "🐸", "🦭", "🐊"
];

    let number = Math.floor(Math.random() * aquaticAnimals.length);

let selectedFish = aquaticAnimals[number];

    fishCount = fishCount + 1;

    document.getElementById("fishDisplay").innerText = "Fish collected: " + fishCount;

    document.getElementById("fishGarden").innerHTML += selectedFish;
}

</script>
</body>
</html>
