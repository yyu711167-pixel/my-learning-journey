<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>My First Website</title>
<style>
    body {
        background-color: #EAF4FF;
        font-family: Arial, sans-serif;
        text-align: center;
        padding: 40px;
    }

    h1 {
        color: #245A81;
        font-size: 36px;
    }

    p {
        color: #526779;
        font-size: 18px;
    }.card {
    background-color: white;
    border-radius: 40px;
    padding: 30px;
    box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
    max-width: 400px;
    margin: 40px auto;
}
@keyframes floating {
    0% {
        transform: translateY(0px);
    }

    50% {
        transform: translateY(-15px);
    }

    100% {
        transform: translateY(0px);
    }
}.floating {
    display: inline-block;
    animation: floating 3s ease-in-out infinite;
}
body.deep-sea {
    background: linear-gradient(
        180deg,
        #061629,
        #123B5D
    );
    min-height: 100vh;
}

body.deep-sea .card {
    background: rgba(20, 55, 85, 0.65);
    box-shadow: 0 0 35px rgba(85, 190, 255, 0.25);
    backdrop-filter: blur(12px);
}

body.deep-sea h1 {
    color: #C8EEFF;
}

body.deep-sea p {
    color: #D6EAF5;
}
/* 悠然水域 */
body.calm-sea {
    background: linear-gradient(
        180deg,
        #EAF4FF,
        #C8E8F5
    );
    min-height: 100vh;
}

/* 活力洋流 */
body.active-sea {
    background: linear-gradient(
        180deg,
        #B8F2E6,
        #67C9C1
    );
    min-height: 100vh;
}

body.active-sea .card {
    background: rgba(255, 255, 255, 0.85);
    box-shadow: 0 8px 30px rgba(20, 130, 125, 0.18);
}
@keyframes swimming {
    0% {
        transform: translateX(0px);
    }

    50% {
        transform: translateX(30px);
    }

    100% {
        transform: translateX(0px);
    }
}

.swimming {
    display: inline-block;
    animation: swimming 4s ease-in-out infinite;
}</style>
</head>
<body>
    <div class="card">
        <h1>Hello, I'm Pixel! 🐟</h1>
        <p id="message">Welcome to my little world.</p>
        <p>I'm learning to build websites!</p>
        <button onclick="sayHello()">Explore My World</button>
<p id="oceanStatus"></p>
<button onclick="changeOcean('deep')">🌌 Deep Sea</button>

<button onclick="changeOcean('calm')">🪼 Calm Waters</button>

<button onclick="changeOcean('active')">🐬 Active Current</button>

<p id="fishDisplay">Aquatic Animals Collected: 0</p>
<div id="fishGarden"></div>
<button onclick="addFish()">Discover an Animal 🪼</button>
    </div>
<script>
    function sayHello() {
    let message = document.getElementById("message");

    if (message.innerText === "Welcome to my little world.") {
        message.innerText = "You found a little surprise! 🐟";
    } else {
        message.innerText = "Welcome to my little world.";
    }
}
    let fishCount = Number(localStorage.getItem("fishCount")) || 0;
    let collectedAnimals =
    JSON.parse(localStorage.getItem("collectedAnimals")) || [];
    collectedAnimals.forEach(function(animal) {
    document.getElementById("fishGarden").innerHTML +=
        '<span class="floating">' + animal + '</span>';
});
    document.getElementById("fishDisplay").innerText =
    "Aquatic Animals Collected: " + fishCount;
    

let oceanRandom = Math.random();

let oceanMode;

if (oceanRandom < 0.5) {
    oceanMode = "deep";
} else if (oceanRandom < 0.85) {
    oceanMode = "calm";
} else {
    oceanMode = "active";
}
if (oceanMode === "deep") {
    document.body.classList.add("deep-sea");
} else if (oceanMode === "calm") {
    document.body.classList.add("calm-sea");
} else {
    document.body.classList.add("active-sea");
}
 let oceanName;

if (oceanMode === "deep") {
    oceanName = "🌌 Deep Sea";
} else if (oceanMode === "calm") {
    oceanName = "🪼 Calm Waters";
} else {
    oceanName = "🐬 Active Current";
}

document.getElementById("oceanStatus").innerText =
    "Current Waters: " + oceanName;
    function addFish() {
    let aquaticAnimals = [
    "🐟", "🐠", "🐡",
    "🐬", "🐳", "🦈",
    "🐙", "🦀", "🦐",
    "🪼", "🦑", "🐢",
    "🐸", "🦭", "🐊"
];

    let number = Math.floor(Math.random() * aquaticAnimals.length);

let selectedFish = aquaticAnimals[number];
collectedAnimals.push(selectedFish);
localStorage.setItem(
    "collectedAnimals",
    JSON.stringify(collectedAnimals)
);
let movement;

if (["🪼", "🐙"].includes(selectedFish)) {
    movement = "floating";
} else {
    movement = "swimming";
}

    fishCount = fishCount + 1;
    localStorage.setItem("fishCount", fishCount);
    document.getElementById("fishDisplay").innerText = "Aquatic Animals Collected: " + fishCount;

    let speed;

if (oceanMode === "deep") {
    speed = Math.random() * 4 + 6;
} else if (oceanMode === "calm") {
    speed = Math.random() * 3 + 3;
} else {
    speed = Math.random() * 1.5 + 1.5;
}

document.getElementById("fishGarden").innerHTML +=
    '<span class="' + movement + '" style="animation-duration: ' +
    speed + 's;">' + selectedFish + '</span>';
}

function changeOcean(newOcean) {
    document.body.classList.remove(
        "deep-sea",
        "calm-sea",
        "active-sea"
    );

    oceanMode = newOcean;

    if (oceanMode === "deep") {
        document.body.classList.add("deep-sea");
        oceanName = "🌌 Deep Sea";
    } else if (oceanMode === "calm") {
        document.body.classList.add("calm-sea");
        oceanName = "🪼 Calm Waters";
    } else {
        document.body.classList.add("active-sea");
        oceanName = "🐬 Active Current";
    }

    document.getElementById("oceanStatus").innerText =
        "Current Waters: " + oceanName;
}
</script>
</body>
</html>
