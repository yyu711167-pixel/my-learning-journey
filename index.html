<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>My First Website</title>
<style>
    body {
        background-color: #EAF4FF;
        font-family: Arial, sans-serif;
        text-align: center;
        padding: 40px;
    }

    h1 {
        color: #245A81;
        font-size: 36px;
    }

    p {
        color: #526779;
        font-size: 18px;
    }.card {
    background-color: white;
    border-radius: 40px;
    padding: 30px;
    box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
    max-width: 400px;
    margin: 40px auto;
}
@keyframes floating {
    0% {
        transform: translateY(0px);
    }

    50% {
        transform: translateY(-15px);
    }

    100% {
        transform: translateY(0px);
    }
}.floating {
    display: inline-block;
    animation: floating 3s ease-in-out infinite;
}
</style>
</head>
<body>
    <div class="card">
        <h1>Hello, I'm Pixel! 🐟</h1>
        <p id="message">Welcome to my little world.</p>
        <p>I'm learning to build websites!</p>
        <button onclick="sayHello()">Explore My World</button>

<p id="oceanStatus"></p>

<p id="fishDisplay">Aquatic Animals Collected: 0</p>
<div id="fishGarden"></div>
<button onclick="addFish()">Discover an Animal 🪼</button>
    </div>
<script>
    function sayHello() {
    let message = document.getElementById("message");

    if (message.innerText === "Welcome to my little world.") {
        message.innerText = "You found a little surprise! 🐟";
    } else {
        message.innerText = "Welcome to my little world.";
    }
}
    let fishCount = 0;

let oceanRandom = Math.random();

let oceanMode;

if (oceanRandom < 0.5) {
    oceanMode = "deep";
} else if (oceanRandom < 0.85) {
    oceanMode = "calm";
} else {
    oceanMode = "active";
}
let oceanName;

if (oceanMode === "deep") {
    oceanName = "🌌 Deep Sea";
} else if (oceanMode === "calm") {
    oceanName = "🪼 Calm Waters";
} else {
    oceanName = "🐬 Active Current";
}

document.getElementById("oceanStatus").innerText =
    "Current Waters: " + oceanName;
    function addFish() {
    let aquaticAnimals = [
    "🐟", "🐠", "🐡",
    "🐬", "🐳", "🦈",
    "🐙", "🦀", "🦐",
    "🪼", "🦑", "🐢",
    "🐸", "🦭", "🐊"
];

    let number = Math.floor(Math.random() * aquaticAnimals.length);

let selectedFish = aquaticAnimals[number];

    fishCount = fishCount + 1;

    document.getElementById("fishDisplay").innerText = "Aquatic Animals Collected: " + fishCount;

    let speed;

if (oceanMode === "deep") {
    speed = Math.random() * 4 + 6;
} else if (oceanMode === "calm") {
    speed = Math.random() * 3 + 3;
} else {
    speed = Math.random() * 1.5 + 1.5;
}

document.getElementById("fishGarden").innerHTML +=
    '<span class="floating" style="animation-duration: ' +
    speed + 's;">' + selectedFish + '</span>';
}

</script>
</body>
</html>
